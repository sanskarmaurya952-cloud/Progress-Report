<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="uplivo-grad" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="uplivo-accent" x1="12" y1="28" x2="36" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b82fc" />
      <stop offset="100%" stop-color="#7c5cfc" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle (subtle dark) -->
  <rect width="48" height="48" rx="12" fill="#1a1a24" />
  
  <!-- Lower upward chevron -->
  <path d="M14 34L24 24L34 34" stroke="url(#uplivo-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Upper upward chevron (prominent) -->
  <path d="M14 23L24 13L34 23" stroke="url(#uplivo-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Apex accent pip -->
  <circle cx="24" cy="9" r="2.5" fill="#5eead4" />
</svg>
